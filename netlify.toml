# ==============================================================================
# Netlify Configuration - Task Ledger Pro (Vite + Tailwind CSS v4 Edition)
# BNI ODP IT 2026
# ==============================================================================

[build]
  command = "npm run build"
  publish = "dist"

# SPA Routing Fallback
# Mengalihkan seluruh rute non-berkas ke index.html (status 200)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Immutable Caching untuk Berkas Hashed Vite
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# No-Cache untuk File Indeks
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
