# ==============================================================================
# Nginx SPA Server Block - Task Ledger Pro (Vite + Tailwind CSS v4 Build)
# BNI ODP IT 2026 - Production Web Architecture
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Root direktori menunjuk ke folder hasil kompilasi Vite (dist/)
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # ==========================================================================
    # GZIP & COMPRESSION
    # ==========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ==========================================================================
    # SECURITY HEADERS
    # ==========================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==========================================================================
    # LONG-TERM CACHING UNTUK HASHED ASSETS VITE (/assets/)
    # Karena Vite menyematkan hash unik pada nama berkas (misal: index-C28a.js),
    # berkas ini aman di-cache selama 1 tahun (immutable).
    # ==========================================================================
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ==========================================================================
    # SPA ROUTING FALLBACK (CRITICAL FOR SINGLE PAGE APPS)
    # Jika URL langsung diakses (misal /tasks/active), Nginx akan mengalihkan
    # rute ke /index.html agar ditangani oleh router sisi klien.
    # ==========================================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html tidak boleh di-cache permanen agar pengguna selalu
    # mendapatkan versi hash terbaru saat ada deployment baru
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Nonaktifkan akses ke berkas tersembunyi
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
